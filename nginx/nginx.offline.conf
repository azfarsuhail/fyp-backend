events {
    worker_connections 1024;
}

# Offline / local setup: plain HTTP on :80, no domain, no SSL.
# Object storage (MinIO-compatible) is NOT proxied here: presigned URLs are
# signed for http://localhost:9000, and path rewriting would break the signature.
http {
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    client_max_body_size 200M;  # exercise video uploads go through /api/

    server {
        listen 80;
        server_name _;

        # Serve the Static Landing Page / admin pages
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Serve the APK file
        location /download/ {
            alias /usr/share/nginx/downloads/;
            default_type application/vnd.android.package-archive;
            add_header Content-Disposition 'attachment';
        }

        location /.well-known/ {
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # FastAPI docs (Swagger UI / ReDoc assets come from a CDN, so they only render online)
        location ~ ^/(docs|redoc|openapi\.json)$ {
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            proxy_pass http://api:8000/health;
        }

        # Proxy the API to the FastAPI Container
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://api:8000/api/;
            proxy_read_timeout 300s;  # first diagnostic call loads CNN + CLIP on CPU

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
