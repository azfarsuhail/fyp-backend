events {
    worker_connections 1024;
}

http {
    # Security & Performance Globals
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    client_max_body_size 10M;

    # ---------------------------------------------------------
    # Server Block 1: Redirect all HTTP traffic to HTTPS
    # ---------------------------------------------------------
    server {
        listen 80;
        server_name kneeoa.online www.kneeoa.online;
        
        # Force redirect to secure connection
        return 301 https://$host$request_uri;
    }

    # ---------------------------------------------------------
    # Server Block 2: The Secure HTTPS Server
    # ---------------------------------------------------------
    server {
        listen 443 ssl;
        server_name kneeoa.online www.kneeoa.online;

        # Let's Encrypt SSL Certificates
        ssl_certificate /etc/letsencrypt/live/kneeoa.online/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/kneeoa.online/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Serve the Static Landing Page
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Serve the APK file
        location /download/ {
            alias /usr/share/nginx/downloads/; 
            default_type application/vnd.android.package-archive;
            add_header Content-Disposition 'attachment';
        }

        # ---------------------------------------------------------
        # NEW: FastAPI ReDoc & OpenAPI Schema
        # ---------------------------------------------------------
        location /redoc {
            proxy_pass http://api:8000/redoc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /openapi.json {
            proxy_pass http://api:8000/openapi.json;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy the API to the FastAPI Container
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://api:8000/api/;
            
            # Standard Proxy Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}