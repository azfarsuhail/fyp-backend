<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knee OA API Tester</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f4f4f9; padding: 20px; max-width: 800px; margin: 0 auto; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2 { margin-top: 0; color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        input, select { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; }
        button:hover { background-color: #0056b3; }
        .response-box { background: #2d2d2d; color: #00ff00; padding: 15px; border-radius: 4px; font-family: monospace; overflow-x: auto; white-space: pre-wrap; margin-top: 15px; min-height: 50px; }
    </style>
</head>
<body>

    <h1>🚀 FastAPI Authentication Tester</h1>

    <div class="card">
        <h2>1. Register User</h2>
        <p style="font-size: 13px; color: #666; margin-top: -6px;">Admin registration is blocked by the backend on purpose.</p>
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="regName" placeholder="John Doe">
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="regEmail" placeholder="john@example.com">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="regPassword" placeholder="supersecret123">
        </div>
        <div class="form-group">
            <label>Role</label>
            <select id="regRole">
                <option value="patient">Patient</option>
                <option value="gp">General Practitioner (GP)</option>
                <option value="admin">Admin</option>
            </select>
        </div>
        <button onclick="registerUser()">Register</button>
        <div class="response-box" id="regResponse">Awaiting registration...</div>
    </div>

    <div class="card">
        <h2>2. Login & Get Token</h2>
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="loginEmail" placeholder="john@example.com">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="loginPassword" placeholder="supersecret123">
        </div>
        <button onclick="loginUser()">Login</button>
        <div class="response-box" id="loginResponse">Awaiting login...</div>
    </div>

    <script>
        const API_BASE = (() => {
            if (window.location.protocol === 'file:') {
                return 'http://127.0.0.1/api/v1/auth';
            }
            return '/api/v1/auth';
        })();

        // Helper function to format JSON output
        function displayResponse(elementId, data) {
            document.getElementById(elementId).innerText = JSON.stringify(data, null, 2);
        }

        async function readResponse(response) {
            const text = await response.text();
            try {
                return JSON.parse(text);
            } catch {
                return { detail: text || response.statusText };
            }
        }

        async function registerUser() {
            const resBox = document.getElementById('regResponse');
            resBox.innerText = "Processing...";

            const payload = {
                full_name: document.getElementById('regName').value,
                email: document.getElementById('regEmail').value,
                password: document.getElementById('regPassword').value,
                role: document.getElementById('regRole').value
            };

            try {
                // FastAPI expects a JSON payload for the register endpoint
                const response = await fetch(`${API_BASE}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await readResponse(response);
                displayResponse('regResponse', data);
            } catch (error) {
                resBox.innerText = "Error connecting to server. Is it running?";
            }
        }

        async function loginUser() {
            const resBox = document.getElementById('loginResponse');
            resBox.innerText = "Processing...";

            // FastAPI's OAuth2PasswordRequestForm expects form-urlencoded data, NOT JSON!
            const formData = new URLSearchParams();
            formData.append('username', document.getElementById('loginEmail').value);
            formData.append('password', document.getElementById('loginPassword').value);

            try {
                const response = await fetch(`${API_BASE}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData
                });
                const data = await readResponse(response);
                displayResponse('loginResponse', data);
                
                // If login is successful, copy the email down to save time
                if(data.access_token) {
                    localStorage.setItem('authTesterToken', data.access_token);
                    console.log("Token saved to localStorage as authTesterToken");
                }
            } catch (error) {
                resBox.innerText = "Error connecting to server. Is it running?";
            }
        }
    </script>
</body>
</html>
