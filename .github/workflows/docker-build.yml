name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    # NEW: Trigger the workflow when a version tag is pushed
    tags:
      - 'v*.*.*'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set test environment variables
        run: |
          echo "SECRET_KEY=test-secret-key-for-testing-only-32chars!" >> $GITHUB_ENV
          echo "TESTING=1" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run pytest
        run: pytest tests/ -v --tb=short --disable-warnings

  build:
    runs-on: ubuntu-latest
    # CRITICAL: Build only runs AFTER test job completes successfully
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/knee-oa-api
          tags: |
            # Tags as 'latest' when pushing to the main branch
            type=raw,value=latest,enable={{is_default_branch}}
            # Automatically strips the 'v' and tags as '1.0.1' when a tag is pushed
            type=semver,pattern={{version}}

      - name: Build and Push API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}