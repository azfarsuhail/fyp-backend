services:
  nginx:
    image: nginx:alpine
    container_name: knee_oa_nginx
    ports:
      - "80:80"
      - "443:443" # Uncomment when adding SSL certificates
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/usr/share/nginx/html:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./download:/usr/share/nginx/downloads
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: knee_oa_api
    working_dir: /code
    env_file:
      - .env
    environment:
      - DEBUG=false
      - LOG_LEVEL=INFO
      - TF_FORCE_GPU_ALLOW_GROWTH=true
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True  # <-- ADD THIS
      - USE_TF=0   # <-- ADD THIS 
    volumes:
      - .:/code
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    restart: unless-stopped
    healthcheck:
      # Using urllib ensures we don't depend on external libraries being installed
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    deploy:
      resources:
        limits:
          cpus: '3.5'      # Leaves 0.5 cores for NGINX/OS on a 4 vCPU instance
          memory: 14G      # Safely scaled up for the 16GB g4dn.xlarge instance
        reservations:
          cpus: '2.0'
          memory: 4G
          # Grants the container access to the Tesla T4 GPU
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true