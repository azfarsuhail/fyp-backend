version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: knee_oa_nginx
    ports:
      - "80:80"
      # - "443:443" # Uncomment when adding SSL certificates
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: knee_oa_api
    env_file:
      - .env
    environment:
      - DEBUG=false
      - LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      # Using urllib ensures we don't depend on external libraries being installed
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '3.5'      # Leaves 0.5 cores for NGINX/OS on a 4 vCPU instance
          memory: 6G       # Safe limit for an 8GB instance
        reservations:
          cpus: '2.0'
          memory: 3G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true